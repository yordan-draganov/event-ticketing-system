name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Build with Maven
      working-directory: ./server
      run: mvn clean install -DskipTests
      
    - name: Run tests
      working-directory: ./server
      run: mvn test
      
    - name: Verify build
      working-directory: ./server
      run: mvn verify