name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        
    - name: Build with Maven
      working-directory: ./server
      run: mvn clean install -DskipTests
      
    - name: Run tests
      working-directory: ./server
      run: mvn test
      
    - name: Verify build
      working-directory: ./server
      run: mvn verify
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          server/target/surefire-reports/*.xml
          server/target/failsafe-reports/*.xml
        retention-days: 7
        
    - name: Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Maven Tests
        path: 'server/target/surefire-reports/*.xml'
        reporter: java-junit
        fail-on-error: true