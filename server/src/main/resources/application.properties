spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

spring.jpa.database-platform=${JPA_PLATFORM}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}

spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=${JPA_PREFERRED_INSTANT_TYPE}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=${JPA_LOB_NON_CONTEXTUAL}

spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED}
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.sql

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}
checkout.reservation-ttl-minutes=${CHECKOUT_RESERVATION_TTL_MINUTES:10}
checkout.reservation-cleanup-delay-ms=${CHECKOUT_RESERVATION_CLEANUP_DELAY_MS:60000}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT}

qr.code.width=300
qr.code.height=300

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

qr.code.hmac.secret=${HMAC_SECRET}

app.url=${APP_URL:http://localhost:8081}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
server.forward-headers-strategy=framework

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

tickets.email.max-attempts=3
tickets.email.retry-delay-ms=2000

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLIC_KEY}

stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

server.port=${SERVER_PORT}
spring.application.name=${APP_NAME}
